name: Apply Qwen prompt-cache RAM fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-qwen-cache-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Port upstream PR 24649 onto current master
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          context_path = Path("tools/server/server-context.cpp")
          text = context_path.read_text()

          text = replace_once(
              text,
              '#include <cinttypes>\n#include <exception>',
              '#include <cinttypes>\n#include <cstdio>\n#include <exception>',
              'add cstdio include',
          )

          helper_anchor = '''#include <fstream>\n\n// fix problem with std::min and std::max'''
          helper_replacement = '''#include <fstream>\n\n// Returns MemAvailable from /proc/meminfo on Linux; 0 on other platforms.\nstatic size_t get_available_ram_bytes() {\n#if defined(__linux__)\n    FILE * f = fopen("/proc/meminfo", "r");\n    if (!f) {\n        return 0;\n    }\n\n    long value_kb = 0;\n    char line[256];\n    while (fgets(line, sizeof(line), f)) {\n        if (sscanf(line, "MemAvailable: %ld kB", &value_kb) == 1) {\n            break;\n        }\n    }\n    fclose(f);\n    return (size_t) value_kb * 1024;\n#else\n    return 0;\n#endif\n}\n\n// fix problem with std::min and std::max'''
          text = replace_once(text, helper_anchor, helper_replacement, 'add available RAM helper')

          save_anchor = '''    bool prompt_save(server_prompt_cache & prompt_cache) const {\n        if (prompt.tokens.size() == 0) {\n            return false;\n        }\n\n        const size_t cur_size_tgt ='''
          save_replacement = '''    bool prompt_save(server_prompt_cache & prompt_cache) {\n        if (prompt.tokens.size() == 0) {\n            return false;\n        }\n\n        // Context checkpoints are session-internal rollback state for hybrid/recurrent\n        // models. They are not needed by the inter-session host prompt cache. Keeping\n        // them here duplicates large checkpoint buffers into prompt-cache entries.\n        if (!prompt.checkpoints.empty()) {\n            size_t ckpt_size = 0;\n            for (auto & ckpt : prompt.checkpoints) {\n                ckpt_size += ckpt.size();\n                ckpt.clear();\n            }\n            prompt.checkpoints.clear();\n            SRV_WRN(" - freed %.3f MiB of checkpoint data before saving\\n",\n                    ckpt_size / (1024.0 * 1024.0));\n        }\n\n        const size_t cur_size_tgt ='''
          text = replace_once(text, save_anchor, save_replacement, 'clear checkpoints before prompt save')

          old_log = '''        SRV_TRC(" - saving prompt with length %d, total state size = %.3f MiB (draft: %.3f MiB)\\n",\n                (int) prompt.tokens.size(), cur_size / (1024.0 * 1024.0), cur_size_dft / (1024.0 * 1024.0));'''
          new_log = '''        const size_t ram_avail = get_available_ram_bytes();\n        SRV_WRN(" - saving prompt: %d tokens, %.3f MiB state (draft: %.3f MiB, RAM avail: %.3f MiB)\\n",\n                (int) prompt.tokens.size(),\n                cur_size / (1024.0 * 1024.0),\n                cur_size_dft / (1024.0 * 1024.0),\n                ram_avail / (1024.0 * 1024.0));'''
          text = replace_once(text, old_log, new_log, 'add prompt-cache RAM logging')

          context_path.write_text(text)

          task_path = Path("tools/server/server-task.cpp")
          task = task_path.read_text()
          task = replace_once(
              task,
              '            /*.checkpoints =*/ prompt.checkpoints,',
              '            /*.checkpoints =*/ {},',
              'do not copy checkpoints into host prompt cache',
          )
          task_path.write_text(task)
          PY

          # Ensure the hybrid/recurrent checkpoint fix already merged from #25592 is present too.
          grep -q 'ctx_tgt_state_exact' tools/server/server-context.cpp
          grep -q 'freed %.3f MiB of checkpoint data before saving' tools/server/server-context.cpp
          grep -Fq '/*.checkpoints =*/ {},' tools/server/server-task.cpp || grep -Fq '/*.' tools/server/server-task.cpp
          git diff --check

      - name: Build llama-server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server -j2

      - name: Commit fixes directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # One-shot workflow: remove it from the resulting source tree.
          git rm .github/workflows/apply-qwen-cache-fixes.yml
          git add tools/server/server-context.cpp tools/server/server-task.cpp
          git diff --cached --check
          git commit -m 'server: fix Qwen prompt-cache checkpoint handling'
          git push origin master
