name: Build patched CUDA image

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even if this exact source image already exists
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: llama-cpp-patched-cuda
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/tultr/llama.cpp

jobs:
  build-push:
    name: Verify, build and push server-cuda
    runs-on: [self-hosted, coolify]
    timeout-minutes: 180

    steps:
      - name: Check out patched fork
        uses: actions/checkout@v4

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          docker version
          docker buildx version || true
          df -h
          docker system df || true

      - name: Verify cache fixes
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # Hybrid/recurrent checkpoint fix (#25592 semantics).
          grep -q 'ctx_tgt_state_exact' tools/server/server-context.cpp

          # Prompt-cache RAM fix (#24649 semantics, ported to current cache ownership).
          grep -q 'Host prompt-cache entries deliberately do not persist them' tools/server/server-task.cpp
          grep -Fq '/*.checkpoints =*/ {},' tools/server/server-task.cpp

          if grep -q 'state_size_tgt + state_size_dft + checkpoints_size' tools/server/server-task.cpp; then
            echo '::error::Prompt-cache sizing is counting checkpoint state again.'
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          version_tag="${source_sha:0:12}"

          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this source is already published
        id: image
        shell: bash
        env:
          VERSION_TAG: ${{ steps.source.outputs.version_tag }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "${IMAGE_NAME}:server-cuda-${VERSION_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image already exists: ${IMAGE_NAME}:server-cuda-${VERSION_TAG}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "No image exists for source ${VERSION_TAG}; build required."
          fi

      - name: Build and push RTX 5090 CUDA server
        if: ${{ steps.image.outputs.exists != 'true' || inputs.force_rebuild == true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_DOCKER_ARCH=120
            APP_VERSION=${{ steps.source.outputs.version_tag }}
            APP_REVISION=${{ steps.source.outputs.source_sha }}
            IMAGE_URL=https://github.com/tultr/llama.cpp
            IMAGE_SOURCE=https://github.com/tultr/llama.cpp
          tags: |
            ${{ env.IMAGE_NAME }}:server-cuda-qwen-cache-fixes
            ${{ env.IMAGE_NAME }}:server-cuda-${{ steps.source.outputs.version_tag }}
          labels: |
            org.opencontainers.image.description=llama.cpp CUDA server with Tultr Qwen cache fixes
            org.opencontainers.image.source=https://github.com/tultr/llama.cpp
            io.tultr.llama-cpp.source=${{ steps.source.outputs.source_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Publish summary
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Tultr patched llama.cpp CUDA image

          - Stable image: \`${IMAGE_NAME}:server-cuda-qwen-cache-fixes\`
          - Immutable image: \`${IMAGE_NAME}:server-cuda-${{ steps.source.outputs.version_tag }}\`
          - Source: \`${{ steps.source.outputs.source_sha }}\`
          - CUDA architecture: \`120\` (RTX 5090 / Blackwell)
          - Image already existed: \`${{ steps.image.outputs.exists }}\`
          EOF
