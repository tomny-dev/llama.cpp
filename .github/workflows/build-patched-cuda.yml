name: Build CUDA image

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CUDA_ARCH: "120"

jobs:
  build:
    name: Build and push CUDA server
    runs-on: [self-hosted, coolify]
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify cache fixes
        shell: bash
        run: |
          set -euo pipefail

          # Hybrid/recurrent checkpoint fix (#25592 semantics).
          grep -q 'ctx_tgt_state_exact' tools/server/server-context.cpp

          # Prompt-cache RAM fix (#24649 semantics, ported to current cache ownership).
          grep -q 'Host prompt-cache entries deliberately do not persist them' tools/server/server-task.cpp
          grep -Fq '/*.checkpoints =*/ {},' tools/server/server-task.cpp

          if grep -q 'state_size_tgt + state_size_dft + checkpoints_size' tools/server/server-task.cpp; then
            echo '::error::Prompt-cache sizing is counting checkpoint state again.'
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.description=llama.cpp CUDA server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CUDA server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_DOCKER_ARCH=${{ env.CUDA_ARCH }}
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}
            IMAGE_URL=https://github.com/${{ github.repository }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## CUDA image'
            echo
            echo 'Published tags:'
            while IFS= read -r tag; do
              echo "- \`$tag\`"
            done <<< "$IMAGE_TAGS"
            echo
            echo "- CUDA architecture: \`${CUDA_ARCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
